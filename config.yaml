gateway_callsign: MSHT-GW
gateway_uid: GW-01
# Einzelner Port:
meshtastic_port: COM7
# Mehrere Ports (Liste für Multi-Stream-Betrieb):
# meshtastic_port:
#   - COM7
#   - COM3
# Statt eines COM-Ports kann ein Gerät auch direkt per Bluetooth LE oder TCP/WLAN angebunden werden
# (auch gemischt mit COM-Ports). BLE benötigt das Python-Paket 'bleak' (wird mit meshtastic installiert):
# meshtastic_port:
#   - COM7
#   - BLE:AA:BB:CC:DD:EE:FF      # BLE-Adresse (oder Gerätename, z. B. BLE:Meshtastic_1a2b)
#   - TCP:192.168.1.50           # Meshtastic-Node im WLAN (Standardport 4403, sonst TCP:host:port)
# "BLE" ohne Ziel verbindet sich mit dem ersten gefundenen Meshtastic-BLE-Gerät.
# BLE-Geräte vorher in Windows NICHT mit einer anderen App (z. B. Meshtastic-App) verbunden lassen.
# Optionaler Relay-Betrieb: empfangenen Mesh-Text automatisch an alle anderen ausgewählten COM-Ports senden
relay_text_messages: true
# Optional nur von diesen COM-Ports relayen (einzelner Wert oder Liste)
# relay_text_from_ports: COM7
# Optional nur an diese COM-Ports relayen (einzelner Wert oder Liste)
# relay_text_to_ports:
#   - COM3
#   - COM9
# ── Remote TAK Server ─────────────────────────────────────────────────────────
# Adresse: Hostname, IP oder URL – z. B. tak.example.com, 10.0.0.5, ssl://tak.example.com:8089
# oder ATAK-Form tak.example.com:8089:ssl. Leer lassen = kein Remote-Server.
# Am einfachsten: in der Browser-UI "TAK-Server-Datenpaket importieren" (.zip aus TAK Server/ATAK)
# – das setzt Host, Port, SSL, Zertifikate und Passwörter automatisch.
tak_server_host: tak.persistentsystems.eu
# Port leer lassen = Standard: TCP 8087 (bzw. 8088 Streaming-TCP bei TAK Server), SSL 8089
tak_server_port: 8089
# TCP = Streaming-CoT, SSL = TLS mit Client-Zertifikat (Standard bei TAK Server/OpenTAKServer), UDP
tak_server_protocol: SSL
# Nur für SSL: Client-Zertifikat (.p12 aus dem Datenpaket oder .pem) und Truststore/CA.
# Relative Pfade beziehen sich auf den Ordner dieser config.yaml.
# Truststore (CA) des OpenTAKServers tak.persistentsystems.eu – prüft das Serverzertifikat:
tak_server_ca_cert: tak_certs/tak.persistentsystems.eu/truststore-root.p12
tak_server_ca_cert_password: atakatak
# Client-Zertifikat: in der Browser-UI mit Benutzername/Passwort "Zertifikat anfordern"
# (wird dann automatisch hier eingetragen) oder eigene .p12 mit privatem Schlüssel angeben:
# tak_server_client_cert: tak_certs/tak.persistentsystems.eu/benutzer.p12
# tak_server_client_cert_password: atakatak
# Port für die Zertifikatsanforderung (TAK Server/OpenTAKServer Standard 8446)
# tak_server_enrollment_port: 8446
# Serverzertifikat prüfen: auto (= nur wenn ein Truststore angegeben ist), true, false
# tak_server_tls_verify: auto
# Hostname im Serverzertifikat zusätzlich prüfen (viele TAK Server haben IP-/Selbstsigniert-Zertifikate)
# tak_server_tls_check_hostname: false
#
# Was vom TAK-Server ins Mesh geht (LoRa-Bandbreite ist knapp!):
#   chat_markers (Standard) | chat | all (inkl. Positionen, je UID max. alle 5 min) | off
# tak_server_to_mesh: chat_markers
# Vom Server empfangene CoT auch an das lokale WinTAK weitergeben
# tak_server_to_local_tak: true
# CoT/Chats vom lokalen WinTAK (am Gateway) auch an den TAK-Server senden (Gateway als TAK-Proxy)
# local_tak_to_server: true
# Gateway meldet sich am Server mit eigener SA an (Callsign gateway_callsign, Position park_lat/park_lon)
# tak_server_send_gateway_sa: true
# tak_server_sa_interval_seconds: 60
# tak_server_team: Cyan
# tak_server_role: Team Member

# Lokales WinTAK-Ziel für Positions- und Chat-CoT
local_tak_ip: 127.0.0.1
local_tak_port: 4242

# UDP-Port, auf den WinTAK seine GeoChat-/Chat-CoT- und sonstigen CoT-Nachrichten
# an dieses Gateway senden soll, damit sie ins Meshtastic-Mesh ausgestrahlt werden.
# Wie bei der LPU5-TAK-Bridge standardmäßig auf dem normalen TAK-UDP-Port 4242.
local_tak_chat_listen_port: 4242
# LPU5-kompatibler WinTAK/ATAK TCP-Empfangspfad:
# Das Gateway verbindet sich als TCP-Client zum in WinTAK/ATAK konfigurierten lokalen Server
# (typisch 127.0.0.1:8087, kein Zertifikat nötig).
# Die aktive Verbindung ist bidirektional: WinTAK -> Gateway und Mesh-CoT -> WinTAK.
local_tak_tcp_receiver_enabled: true
local_tak_tcp_receiver_host: 127.0.0.1
local_tak_tcp_receiver_port: 8087
# TCP-first last-hop delivery (Option B):
# Wenn true (Standard), wird CoT zuerst über TCP 127.0.0.1:8087 an WinTAK/LPU5 gesendet
# und UDP/4242 nur als Fallback genutzt. Dies ist die zuverlässigere Option wenn UDP/4242
# durch Windows blockiert wird (WinError 10013). Auf false setzen für Legacy-UDP-first-Betrieb.
prefer_local_tcp_over_udp: true
# Optionaler lokaler TCP-Fallback-Listener für externe/ältere Setups.
local_tak_tcp_listen_port: 8088
# Optional: zusätzliche TAK-Multicast-Gruppen für GeoChat / SA lauschen und senden
# (hilfreich wenn WinTAK/ATAK oder ein TAK-Server Chat/CoT per Multicast verteilt).
tak_multicast_groups:
  - 224.10.10.1:17012
  - 239.2.3.1:6969
# Optional: lokale Interface-IP für den Multicast-Join (Standard 0.0.0.0 = OS-Default).
# tak_multicast_interface_ip: 0.0.0.0
# Optional: auf welcher lokalen IP der Chat-Listener lauscht.
# Standard ist 0.0.0.0, damit WinTAK sowohl über 127.0.0.1 als auch über die LAN-IP
# des Gateway-Rechners senden kann. Ausgehende Mesh-Nachrichten gehen immer auf Main-Channel 0.
# local_tak_chat_listen_ip: 0.0.0.0
# Optional: eigene Bind-IP für den TCP-Listener. Standard ist 0.0.0.0,
# damit WinTAK wie bei LPU5 auch von anderen Systemen per TCP 8088 verbinden kann.
# local_tak_tcp_listen_ip: 0.0.0.0

# true  = alle Nodes anzeigen – Nodes ohne GPS-Fix werden bei park_lat/park_lon platziert (empfohlen)
# false = nur Nodes mit gültigen GPS-Koordinaten senden
send_nodes_without_gps: true

# Fallback-Koordinaten für Nodes ohne GPS-Fix.
# WICHTIG: Diese müssen gesetzt sein wenn send_nodes_without_gps=true,
# sonst werden no-fix Nodes übersprungen.
# Beispiel: Koordinaten eurer Basis/Funkstelle eintragen:
# park_lat: 48.1351
# park_lon: 11.5820

# Optional: Beim Start die eigene Gateway-Position ins Mesh schreiben
# (nutzt park_lat/park_lon als feste Position für den lokalen Knoten)
# set_gateway_position_on_start: true

# Log-Level: INFO (Standard) zeigt nur wichtige Meldungen.
# DEBUG aktiviert zusätzliche Diagnosen für empfangene Meshtastic- sowie WinTAK/TAK-Pakete.
# Mögliche Werte: DEBUG, INFO, WARNING, ERROR
# log_level: DEBUG

# Raw Meshtastic Payload Logging
# Wenn true, loggt das Gateway für jeden empfangenen inbound Meshtastic-Paket
# den exakten Rohpayload als Hex-Dump und Base64 (portnum: ATAK_PLUGIN, ATAK_FORWARDER,
# TEXT_MESSAGE_APP, POSITION_APP, NODEINFO_APP). Nützlich zur Diagnose von
# Marker-/PLI-Rekonstruktionsproblemen.
# Standard: false (rückwärtskompatibel)
# log_raw_meshtastic_payloads: false
#
# Wenn true, wird bei großen Payloads der vollständige Hex-Dump ausgegeben
# statt nur die ersten 16 Bytes als Präfix. Kann bei langen ATAK_FORWARDER-Paketen
# sehr lange Logzeilen erzeugen – nur für gezielte Diagnosen aktivieren.
# log_raw_meshtastic_payloads_full: false
